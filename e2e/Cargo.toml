[package]
name = "home-rss-e2e"
version = "0.0.0"
edition = "2024"
publish = false

# Not a member of the root workspace: `cargo test --workspace` must keep running
# without a database, and these tests always need one. Run them through e2e/run.sh.
[workspace]

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt"] }
tokio-postgres = "0.7.18"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
