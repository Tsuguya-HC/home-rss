spin_manifest_version = 2

[application]
name = "home-rss-server"
version = "0.1.0"

[variables]
db_url = { required = true }
db_ca_root = { required = true }

[[trigger.http]]
route = "/api/..."
component = "server"

[component.server]
source = "../target/wasm32-wasip1/release/home_rss_server.wasm"
# POST /api/feeds がその場でフィードを取得するため、fetcher と同じく HTTPS の
# outbound が必要。平文フィードはアプリ層でも拒否する (shared::fetch::require_https)。
# CNP が world:443 しか開けていない点は fetcher と共通。
allowed_outbound_hosts = ["postgres://*:5432", "https://*:443"]
[component.server.variables]
db_url = "{{ db_url }}"
db_ca_root = "{{ db_ca_root }}"
[component.server.build]
command = "cargo build --target wasm32-wasip1 --release -p home-rss-server"
workdir = ".."
