spin_manifest_version = 2

[application]
name = "home-rss-server"
version = "0.1.0"

[variables]
db_url = { required = true }
db_ca_root = { required = true }

[[trigger.http]]
route = "/api/..."
component = "server"

[component.server]
source = "../target/wasm32-wasip1/release/home_rss_server.wasm"
# HTTPS only, same as the fetcher: the CiliumNetworkPolicy in home-cluster
# opens world:443 and nothing else, so a plaintext feed would hang rather
# than fail, and an article body fetched over a channel anyone can rewrite
# ends up rendered in the UI. The CNP must cover the server pods too.
allowed_outbound_hosts = ["postgres://*:5432", "https://*:443"]
[component.server.variables]
db_url = "{{ db_url }}"
db_ca_root = "{{ db_ca_root }}"
[component.server.build]
command = "cargo build --target wasm32-wasip1 --release -p home-rss-server"
workdir = ".."
