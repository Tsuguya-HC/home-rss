spin_manifest_version = 2

[application]
name = "home-rss-fetcher"
version = "0.1.0"

[variables]
db_url = { required = true }
db_ca_root = { required = true }

[[trigger.http]]
route = "/fetch"
component = "fetcher"

[component.fetcher]
source = "../target/wasm32-wasip1/release/home_rss_fetcher.wasm"
# HTTPS only. The CiliumNetworkPolicy in home-cluster opens world:443 and
# nothing else, so a plaintext feed would hang rather than fail, and an
# article body fetched over a channel anyone can rewrite ends up rendered
# in the UI.
allowed_outbound_hosts = ["postgres://*:5432", "https://*:443"]
[component.fetcher.variables]
db_url = "{{ db_url }}"
db_ca_root = "{{ db_ca_root }}"
[component.fetcher.build]
command = "cargo build --target wasm32-wasip1 --release -p home-rss-fetcher"
workdir = ".."
