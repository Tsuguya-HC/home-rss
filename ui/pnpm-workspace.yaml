# Refuse to resolve any version published less than 3 days ago (pnpm >= 10.16,
# value in minutes). Renovate's own minimumReleaseAge cannot cover a lock-file
# refresh — there is no single release to date, every transitive dependency
# just jumps to whatever satisfies the range — so the cooldown has to be
# enforced here, at resolution time, where it applies to every package in the
# tree.
minimumReleaseAge: 4320

# pnpm 10+ refuses to run a dependency's install scripts unless it is listed
# here, and pnpm 11 turns that from a warning into ERR_PNPM_IGNORED_BUILDS —
# which is what has been failing build-ui (and therefore every open PR) since
# the action's `version: latest` rolled forward. esbuild's postinstall fetches
# its platform binary, so vite cannot build without it.
onlyBuiltDependencies:
  - esbuild
