spin_manifest_version = 2

[application]
name = "home-rss-ui"
version = "0.1.0"

[variables]
api_url = { required = true }

[[trigger.http]]
route = "/..."
component = "ui"

[component.ui]
source = "../target/wasm32-wasip1/release/home_rss_ui.wasm"
allowed_outbound_hosts = ["http://*:80", "http://*:3000", "http://*:8080"]
[component.ui.variables]
api_url = "{{ api_url }}"
[component.ui.build]
command = "cargo build --target wasm32-wasip1 --release -p home-rss-ui"
workdir = ".."
