name: Build and Push

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "ui/**"
      - "fetcher/**"
      - "cleaner/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, fetcher, cleaner]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        run: cargo build --target wasm32-wasip1 --release -p home-rss-${{ matrix.service }}

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service }} to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          spin registry push \
            -f "${{ matrix.service }}/spin.toml" \
            "ghcr.io/tsuguya/home-rss-${{ matrix.service }}:${{ github.ref_name }}"

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # No `version:` — the action reads ui/package.json's packageManager field,
      # so the pnpm CI runs on is pinned and Renovate proposes bumps as PRs.
      # `latest` silently rolled onto pnpm 11, whose stricter handling of
      # ignored install scripts broke every build here.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ui to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          spin registry push \
            -f "ui/spin.toml" \
            "ghcr.io/tsuguya/home-rss-ui:${{ github.ref_name }}"

  # The only required status check. Aggregates every correctness leaf so the
  # ruleset never names an individual job: build-rust is a matrix, so its real
  # check names are "build-rust (server)" etc. and naming them in the ruleset
  # breaks the moment the matrix changes (a required context that is never
  # reported blocks the PR forever).
  gate:
    name: CI Gate
    needs: [build-rust, build-ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # fail-closed: an empty needs list would make the loop pass vacuously
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done
