name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "server/**"
      - "ui/**"
      - "fetcher/**"
      - "cleaner/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "ui/**"
      - "fetcher/**"
      - "cleaner/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, fetcher, cleaner]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        run: cargo build --target wasm32-wasip1 --release -p home-rss-${{ matrix.service }}

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service }} to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          spin registry push \
            -f "${{ matrix.service }}/spin.toml" \
            "ghcr.io/tsuguya/home-rss-${{ matrix.service }}:${{ github.ref_name }}"

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: fermyon/actions/spin/setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI
        working-directory: ui
        run: pnpm install && pnpm run build

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ui to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          spin registry push \
            -f "ui/spin.toml" \
            "ghcr.io/tsuguya/home-rss-ui:${{ github.ref_name }}"
