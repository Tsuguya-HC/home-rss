name: Build and Push

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # No paths filter. `CI Gate` is a required check, so a pull request that
  # touches nothing on the list starts no run, reports nothing, and waits
  # forever for a status that will never arrive. The list was grown one entry
  # at a time as each blocked case turned up — workflows, then the Renovate
  # config — and a README-only change was the next one to find. An enumeration
  # that has to be exhaustive to avoid a deadlock will keep being wrong.
  #
  # home-cluster's lint.yaml runs on every pull request for the same reason.
  pull_request:
    branches: [main]

# `packages: write` used to be granted here, which handed it to every job
# including the gate. Only the two jobs that actually push to GHCR ask for it.
permissions: {}

concurrency:
  # PR は最新の push だけ残す。push / dispatch は SHA ごとに別グループにして
  # 互いをキャンセルさせない（タグ push のリリースビルドを後続が消さないため）。
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-rust:
    name: build rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # spin registry push → ghcr.io
    strategy:
      fail-fast: false
      matrix:
        service: [server, fetcher, cleaner]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # runner の rust で代替せよという指摘だが、この action は既定に無い
      # wasm32-wasip1 ターゲットの追加とツールチェイン固定を兼ねている。
      # script で書き直すと同じことを手で再実装することになる。
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[superfluous-actions,stale-action-refs]
        with:
          targets: wasm32-wasip1

      # Flagged because this workflow also publishes on tag pushes. Actions
      # caches are scoped per branch: a PR's cache is readable only by that PR's
      # own runs, and a tag build falls back to the default branch's scope. So
      # poisoning the release build means writing to main's cache scope, which
      # needs push access to main — not something a PR can reach. Splitting the
      # tag build into its own cache-free workflow is the structural fix if this
      # ever stops being true.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning,ref-version-mismatch]

      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        env:
          # matrix は静的な定義なので値は攻撃者に触れないが、run へ直接展開すると
          # 「安全な式かどうか」を読む側が毎回判断することになる。env 経由に固定する。
          SERVICE: ${{ matrix.service }}
        run: cargo build --target wasm32-wasip1 --release -p "home-rss-${SERVICE}"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag name reaches the shell as an environment variable, not as a
      # `${{ }}` expansion inside the script: a ref name is attacker-chosen text
      # and expanding it inline splices it into the command.
      - name: Push ${{ matrix.service }} to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ github.ref_name }}
        run: |
          spin registry push \
            -f "${SERVICE}/spin.toml" \
            "ghcr.io/tsuguya/home-rss-${SERVICE}:${TAG}"

  # ワークスペースの既定ターゲットは wasm32-wasip1 (.cargo/config.toml) なので、
  # そのまま cargo test するとテストバイナリをホストで実行できず
  # `Exec format error` で落ちる。wasm ランナーを持ち込むより、ここだけ
  # ホストターゲットを明示するほうが依存が増えない。spin-sdk はホストでも
  # コンパイルが通るので、SDK に触らない純粋なロジックはこれで検査できる。
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[superfluous-actions,stale-action-refs]

      # Same reasoning as the Rust cache in build-rust above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning,ref-version-mismatch]

      - name: Run tests
        run: cargo test --workspace --target x86_64-unknown-linux-gnu

  build-ui:
    name: build ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # spin registry push → ghcr.io
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # No `version:` — the action reads ui/package.json's packageManager field,
      # so the pnpm CI runs on is pinned and Renovate proposes bumps as PRs.
      # `latest` silently rolled onto pnpm 11, whose stricter handling of
      # ignored install scripts broke every build here.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: ui/package.json

      # Same reasoning as the Rust cache in build-rust above.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 # zizmor: ignore[cache-poisoning,ref-version-mismatch]
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ui to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          spin registry push \
            -f "ui/spin.toml" \
            "ghcr.io/tsuguya/home-rss-ui:${TAG}"

  # Checks the workflow expressions and job graph, and shells out to shellcheck
  # for every `run:` block.
  # ワークフローの lint は 6 リポジトリ共通なので home-actions に寄せてある。
  # ツールのピンは向こう側にあり、ここは呼び先の SHA を追うだけ。
  lint-workflows:
    uses: Tsuguya/home-actions/.github/workflows/lint-workflows.yml@bd99e01e99bcce1b845aa7abae3b3ed3b61f464f # v1.1.0
    permissions:
      contents: read

  # Renovate 設定の検証。Renovate は知らないキーを黙って捨てるので（PR も警告も
  # 出ない）、バリデータだけがこの層の間違いを検出できる。home-cluster は
  # `ignoredAuthors` の綴り違いを 5 週間放置していた。
  lint-renovate:
    uses: Tsuguya/home-actions/.github/workflows/lint-renovate.yml@bd99e01e99bcce1b845aa7abae3b3ed3b61f464f # v1.1.0
    permissions:
      contents: read
  gate:
    name: CI Gate
    needs: [build-rust, test, build-ui, lint-workflows, lint-renovate]
    # `always()` ではなく `!cancelled()`。always() だと run をキャンセルしたとき
    # 全ての leaf が `cancelled` を返し、下の case をすり抜けて必須チェックが
    # 失敗として記録される。キャンセルされた run に下すべき判定は無い。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # fail-closed: an empty needs list would make the loop pass vacuously
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done
