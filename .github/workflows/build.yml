name: Build and Push

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "ui/**"
      - "fetcher/**"
      - "cleaner/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Any workflow file, not just this one — the actionlint and zizmor jobs
      # below audit every workflow in the repo, so a new one has to trigger them.
      - ".github/workflows/**"

# `packages: write` used to be granted here, which handed it to every job
# including the gate. Only the two jobs that actually push to GHCR ask for it.
permissions: {}

jobs:
  build-rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # spin registry push → ghcr.io
    strategy:
      fail-fast: false
      matrix:
        service: [server, fetcher, cleaner]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip1

      # Flagged because this workflow also publishes on tag pushes. Actions
      # caches are scoped per branch: a PR's cache is readable only by that PR's
      # own runs, and a tag build falls back to the default branch's scope. So
      # poisoning the release build means writing to main's cache scope, which
      # needs push access to main — not something a PR can reach. Splitting the
      # tag build into its own cache-free workflow is the structural fix if this
      # ever stops being true.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]

      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        run: cargo build --target wasm32-wasip1 --release -p home-rss-${{ matrix.service }}

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag name reaches the shell as an environment variable, not as a
      # `${{ }}` expansion inside the script: a ref name is attacker-chosen text
      # and expanding it inline splices it into the command.
      - name: Push ${{ matrix.service }} to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ github.ref_name }}
        run: |
          spin registry push \
            -f "${SERVICE}/spin.toml" \
            "ghcr.io/tsuguya/home-rss-${SERVICE}:${TAG}"

  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # spin registry push → ghcr.io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # No `version:` — the action reads ui/package.json's packageManager field,
      # so the pnpm CI runs on is pinned and Renovate proposes bumps as PRs.
      # `latest` silently rolled onto pnpm 11, whose stricter handling of
      # ignored install scripts broke every build here.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ui/package.json

      # Same reasoning as the Rust cache in build-rust above.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ui to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          spin registry push \
            -f "ui/spin.toml" \
            "ghcr.io/tsuguya/home-rss-ui:${TAG}"

  # Checks the workflow expressions and job graph, and shells out to shellcheck
  # for every `run:` block.
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Lint workflows
        run: |
          set -euo pipefail
          # actionlint silently skips its shell checks when shellcheck is
          # absent, which would quietly reduce this job to expression linting
          # if the runner image ever drops it.
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not on the runner; actionlint would skip every run: block"
            exit 1
          }
          actionlint -no-color

  # Static audit of the workflows themselves: template injection, credential
  # persistence, permission scope, cache poisoning. This workflow publishes the
  # images the cluster runs, so it is the one most worth auditing.
  zizmor:
    runs-on: ubuntu-latest
    # This repo is private and has no Advanced Security, so there is nowhere to
    # upload SARIF to; findings surface as job annotations instead. `contents:
    # read` is still needed — a private repo cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: "1.29.0"
          advanced-security: false
          annotations: true

  # The only required status check. Aggregates every correctness leaf so the
  # ruleset never names an individual job: build-rust is a matrix, so its real
  # check names are "build-rust (server)" etc. and naming them in the ruleset
  # breaks the moment the matrix changes (a required context that is never
  # reported blocks the PR forever).
  gate:
    name: CI Gate
    needs: [build-rust, build-ui, actionlint, zizmor]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # fail-closed: an empty needs list would make the loop pass vacuously
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done
