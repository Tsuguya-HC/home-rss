name: test

# ワークスペースの既定ターゲットは wasm32-wasip1 (.cargo/config.toml) なので、
# そのまま cargo test するとテストバイナリをホストで実行できず
# `Exec format error` で落ちる。wasm ランナーを持ち込むより、ここだけ
# ホストターゲットを明示するほうが依存が増えない。spin-sdk はホストでも
# コンパイルが通るので、SDK に触らない純粋なロジックはこれで検査できる。
on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[superfluous-actions,stale-action-refs]

      # 検証専用の leaf なので、キャッシュを読むのはここだけで完結する。
      # リリースビルドはこの leaf を呼ばない。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo test --workspace --target x86_64-unknown-linux-gnu
