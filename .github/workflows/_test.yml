name: test

# ワークスペースの既定ターゲットは wasm32-wasip1 (.cargo/config.toml) なので、
# そのまま cargo test するとテストバイナリをホストで実行できず
# `Exec format error` で落ちる。wasm ランナーを持ち込むより、ここだけ
# ホストターゲットを明示するほうが依存が増えない。spin-sdk はホストでも
# コンパイルが通るので、SDK に触らない純粋なロジックはこれで検査できる。
on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup を直に叩く。dtolnay/rust-toolchain は README が明言しているとおり
      # 「@rev がツールチェインを選ぶ」設計で、そのために 290 本のバージョンを
      # **タグではなくブランチ**として持っている（タグは v1 の 1 本だけ）。しかも
      # master が動くたびに全ブランチの先端が作り直されて force-push される —
      # 2015 年の Rust 1.0 に対応する `1.0.0` ブランチの先端すら、日付は最新の
      # リリース日になっている。
      #
      # 結果、SHA でピンするとどのブランチからも到達不能な commit を指すことになり、
      # zizmor の impostor-commit が High で咎める。孤児 commit を GitHub が返し
      # 続けるのは fork も含む repository network から引けるからで、つまり
      # 「force-push で孤児になった commit」と「攻撃者が fork に置いた commit」を
      # 区別できない。ピンを外す選択肢は無いので、action の側を外す。
      #
      # 置き換えても失うものは無い。この step の出力（cachekey / name）は
      # どこからも参照していないし、キャッシュは Swatinem/rust-cache が別に持つ。
      - name: Install Rust toolchain
        env:
          # renovate: datasource=github-releases depName=rust-lang/rust
          RUST_VERSION: "1.98.1"
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"

      # 検証専用の leaf なので、キャッシュを読むのはここだけで完結する。
      # リリースビルドはこの leaf を呼ばない。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo test --workspace --target x86_64-unknown-linux-gnu
