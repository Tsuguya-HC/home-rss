name: build ui

# UI (spin-fileserver + vite の成果物) のビルド leaf。
# concurrency を持たない理由は _build-rust.yml と同じ。
on:
  workflow_call:
    inputs:
      publish:
        description: ビルド成果物を GHCR に push するか
        type: boolean
        default: false
      tag:
        description: push 先のタグ。publish が true のときだけ使う
        type: string
        default: ""

# permissions を書かない理由は _build-rust.yml と同じ（呼び出し元の付与を
# そのまま継承させる。`{}` を置くと release の packages: write が消える）。
env:
  # The ceiling is the node, not this runner. containerd-shim-spin v0.25.1 — its
  # newest release, and the one the Talos `spin` extension carries — links Spin
  # v4.0.1, so a component built by a newer CLI targets a runtime the cluster
  # does not have. Left at the action's default `latest` this moved 4.0.2 ->
  # 4.1.0 on its own between v0.1.4 and v0.1.5, with no diff to review.
  #
  # The `v` is added at the use site: the action pastes this straight into a
  # release download URL, but the manager that maintains these pins strips the
  # tag's leading v, so the file has to hold the bare version like every other
  # pin here.
  # renovate: datasource=github-releases depName=spinframework/spin
  SPIN_CLI_VERSION: "4.0.2"

jobs:
  build-ui: # zizmor: ignore[excessive-permissions] reusable workflow — permissions come from the caller job (see comment above)
    name: build ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:` — the action reads ui/package.json's packageManager field,
      # so the pnpm CI runs on is pinned and Renovate proposes bumps as PRs.
      # `latest` silently rolled onto pnpm 11, whose stricter handling of
      # ignored install scripts broke every build here.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      # 検証ビルドだけキャッシュする。理由は _build-rust.yml と同じ。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !inputs.publish }}
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ inputs.publish }}
        with:
          node-version: 24

      # The ceiling is the node, not this runner. containerd-shim-spin v0.25.1 —
      # the newest release, and the one baked into the Talos `spin` extension —
      # links Spin v4.0.1, so a component built by a newer CLI is built for a
      # runtime the cluster does not have. Left at the default `latest` this
      # step moved 4.0.2 -> 4.1.0 on its own between v0.1.4 and v0.1.5, with no
      # diff to review. Raise this only when the shim raises its own.
      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          version: v${{ env.SPIN_CLI_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ui to GHCR
        if: ${{ inputs.publish }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::publish was requested without a tag"
            exit 1
          fi
          spin registry push \
            -f "ui/spin.toml" \
            "ghcr.io/tsuguya-hc/home-rss-ui:${TAG}"
