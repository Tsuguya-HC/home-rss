name: build rust

# Rust コンポーネント (server / fetcher / cleaner) のビルド leaf。
# `publish` で pull request の検証とタグリリースの両方を賄う。
#
# concurrency はここには書かない。同じビルドでも PR は「最新の push だけ残す」、
# リリースは「進行中を絶対に殺さない」で要件が正反対なので、その判断は
# 呼び出し元 (ci.yml / release.yml) が持つ。
on:
  workflow_call:
    inputs:
      publish:
        description: ビルド成果物を GHCR に push するか
        type: boolean
        default: false
      tag:
        description: push 先のタグ。publish が true のときだけ使う
        type: string
        default: ""

permissions: {}

jobs:
  build-rust:
    name: build rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # permissions を宣言しない。reusable workflow の job は呼び出し元が渡した
    # 権限を超えられず、超える宣言をすると run 自体が拒否される。ここに
    # `packages: write` と書くと、push しない検証呼び出し側にも同じ権限を
    # 要求することになる。必要な権限は呼び出し元が決める:
    #   ci.yml      → contents: read だけ
    #   release.yml → contents: read + packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [server, fetcher, cleaner]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # runner の rust で代替せよという指摘だが、この action は既定に無い
      # wasm32-wasip1 ターゲットの追加とツールチェイン固定を兼ねている。
      # script で書き直すと同じことを手で再実装することになる。
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[superfluous-actions,stale-action-refs]
        with:
          targets: wasm32-wasip1

      # キャッシュは検証ビルドだけで使う。リリースビルドがキャッシュを読まない
      # なら、PR が書けるスコープから成果物へ至る経路が存在しない
      # ——「タグビルドをキャッシュ無しの別ワークフローに分ける」という
      # 構造的な対処を、ここで満たしている。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.publish }}

      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        env:
          # matrix は静的な定義なので値は攻撃者に触れないが、run へ直接展開すると
          # 「安全な式かどうか」を読む側が毎回判断することになる。env 経由に固定する。
          SERVICE: ${{ matrix.service }}
        run: cargo build --target wasm32-wasip1 --release -p "home-rss-${SERVICE}"

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag reaches the shell as an environment variable, not as a `${{ }}`
      # expansion inside the script: a ref name is attacker-chosen text and
      # expanding it inline splices it into the command.
      - name: Push ${{ matrix.service }} to GHCR
        if: ${{ inputs.publish }}
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # 呼び出し元が tag を渡し忘れると `:` で終わる参照になり、spin が
          # latest として解釈して意図しないタグを上書きしうる。空なら止める。
          if [ -z "${TAG}" ]; then
            echo "::error::publish was requested without a tag"
            exit 1
          fi
          spin registry push \
            -f "${SERVICE}/spin.toml" \
            "ghcr.io/tsuguya/home-rss-${SERVICE}:${TAG}"
