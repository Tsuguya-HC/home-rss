name: build rust

# Rust コンポーネント (server / fetcher / cleaner) のビルド leaf。
# `publish` で pull request の検証とタグリリースの両方を賄う。
#
# concurrency はここには書かない。同じビルドでも PR は「最新の push だけ残す」、
# リリースは「進行中を絶対に殺さない」で要件が正反対なので、その判断は
# 呼び出し元 (ci.yml / release.yml) が持つ。
on:
  workflow_call:
    inputs:
      publish:
        description: ビルド成果物を GHCR に push するか
        type: boolean
        default: false
      tag:
        description: push 先のタグ。publish が true のときだけ使う
        type: string
        default: ""

# permissions はワークフローにも job にも書かない。reusable workflow の job は
# 呼び出し元が job に渡した権限をそのまま継承し、超えることはできない。
# ここに `permissions: {}` を置くと job がそれを継承して呼び出し元の
# `packages: write` が届かず、`spin registry push` が 403 になる（v0.1.4 で
# 実際に起きた）。逆に job に `packages: write` と書くと、push しない検証
# 呼び出し側にも同じ権限を要求することになる。必要な権限は呼び出し元が決める:
#   ci.yml      → contents: read だけ
#   release.yml → contents: read + packages: write
jobs:
  build-rust: # zizmor: ignore[excessive-permissions] reusable workflow — permissions come from the caller job (see comment above)
    name: build rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [server, fetcher, cleaner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup を直に叩く。dtolnay/rust-toolchain は README が明言しているとおり
      # 「@rev がツールチェインを選ぶ」設計で、そのために 290 本のバージョンを
      # **タグではなくブランチ**として持っている（タグは v1 の 1 本だけ）。しかも
      # master が動くたびに全ブランチの先端が作り直されて force-push される —
      # 2015 年の Rust 1.0 に対応する `1.0.0` ブランチの先端すら、日付は最新の
      # リリース日になっている。
      #
      # 結果、SHA でピンするとどのブランチからも到達不能な commit を指すことになり、
      # zizmor の impostor-commit が High で咎める。孤児 commit を GitHub が返し
      # 続けるのは fork も含む repository network から引けるからで、つまり
      # 「force-push で孤児になった commit」と「攻撃者が fork に置いた commit」を
      # 区別できない。ピンを外す選択肢は無いので、action の側を外す。
      #
      # 置き換えても失うものは無い。この step の出力（cachekey / name）は
      # どこからも参照していないし、キャッシュは Swatinem/rust-cache が別に持つ。
      - name: Install Rust toolchain
        env:
          # renovate: datasource=github-releases depName=rust-lang/rust
          RUST_VERSION: "1.98.1"
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update --target wasm32-wasip1
          rustup default "$RUST_VERSION"

      # キャッシュは検証ビルドだけで使う。リリースビルドがキャッシュを読まない
      # なら、PR が書けるスコープから成果物へ至る経路が存在しない
      # ——「タグビルドをキャッシュ無しの別ワークフローに分ける」という
      # 構造的な対処を、ここで満たしている。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.publish }}

      - uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9 # v1.0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        env:
          # matrix は静的な定義なので値は攻撃者に触れないが、run へ直接展開すると
          # 「安全な式かどうか」を読む側が毎回判断することになる。env 経由に固定する。
          SERVICE: ${{ matrix.service }}
        run: cargo build --target wasm32-wasip1 --release -p "home-rss-${SERVICE}"

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag reaches the shell as an environment variable, not as a `${{ }}`
      # expansion inside the script: a ref name is attacker-chosen text and
      # expanding it inline splices it into the command.
      - name: Push ${{ matrix.service }} to GHCR
        if: ${{ inputs.publish }}
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # 呼び出し元が tag を渡し忘れると `:` で終わる参照になり、spin が
          # latest として解釈して意図しないタグを上書きしうる。空なら止める。
          if [ -z "${TAG}" ]; then
            echo "::error::publish was requested without a tag"
            exit 1
          fi
          spin registry push \
            -f "${SERVICE}/spin.toml" \
            "ghcr.io/tsuguya-hc/home-rss-${SERVICE}:${TAG}"
