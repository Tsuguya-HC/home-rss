[workspace]
members = ["server", "fetcher", "cleaner", "shared"]
resolver = "2"

[workspace.dependencies]
spin-sdk = "6.0.0"
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
feed-rs = "2.3.1"
quick-xml = "0.42"
url = "2.5"
chrono = { version = "0.4", default-features = false }
uuid = { version = "1", default-features = false }
