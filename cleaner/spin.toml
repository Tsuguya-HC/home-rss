spin_manifest_version = 2

[application]
name = "home-rss-cleaner"
version = "0.1.0"

[variables]
db_url = { required = true }
db_ca_root = { required = true }
retention_days = { default = "30" }

[[trigger.http]]
route = "/clean"
component = "cleaner"

[component.cleaner]
source = "../target/wasm32-wasip1/release/home_rss_cleaner.wasm"
allowed_outbound_hosts = ["postgres://*:5432"]
[component.cleaner.variables]
db_url = "{{ db_url }}"
db_ca_root = "{{ db_ca_root }}"
retention_days = "{{ retention_days }}"
[component.cleaner.build]
command = "cargo build --target wasm32-wasip1 --release -p home-rss-cleaner"
workdir = ".."
